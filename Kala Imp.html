<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>കലസ്തീൻ 2026 – Live Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #4a148c; --secondary: #7b1fa2; --accent: #ffc107; --bg: #f5f6fa; --text: #2f3640; --success: #27ae60; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e0e0e0; margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 1100px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        nav { background: var(--primary); padding: 10px; border-radius: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; position: sticky; top: 10px; z-index: 100; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        nav a:hover { background: var(--accent); color: var(--primary); }
        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--primary); color: white; padding: 12px; font-size: 12px; }
        td { padding: 10px; text-align: center; border: 1px solid #eee; background: #fff; }
        input, select { padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 5px; margin-bottom: 5px; box-sizing: border-box; }
        .btn { border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; margin: 5px; transition: 0.3s; }
        .result-card { border: 2px solid var(--primary); border-radius: 12px; padding: 15px; margin-top: 25px; background: #fdfdfd; }
        .points-badge { background: var(--accent); color: #000; padding: 15px; font-size: 28px; font-weight: bold; text-align: center; border-radius: 8px; margin: 15px 0; }
        .status-indicator { font-size: 12px; text-align: center; margin-bottom: 10px; color: #666; font-weight: bold; }
        .live-dot { height: 10px; width: 10px; background-color: #27ae60; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
        .delete-btn { background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 5px 10px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <div style="text-align: center;">
        <h1 style="color: var(--primary); margin-bottom: 5px;">കലസ്തീൻ 2026</h1>
        <div class="status-indicator" id="syncStatus">Initializing...</div>
    </div>
    
    <nav class="no-print">
        <a id="nav-entry" style="display:none;" onclick="showPage('home')">ENTRY FORM</a>
        <a onclick="showPage('events')">EVENT LIST</a>
        <a onclick="showPage('groupTotal')">LEADERBOARD</a>
        <a onclick="showPage('studentReport')">SEARCH</a>
        <a onclick="syncFromCloud()" style="background: #2980b9;">REFRESH</a>
        <a id="authBtn" onclick="handleAuth()" style="background:var(--accent); color:black;">ADMIN LOGIN</a>
    </nav>

    <div id="home" class="page">
        <h3>Admin: New Result Entry</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
            <input id="eventName" placeholder="Event Name">
            <select id="eventType"><option value="individual">Individual</option><option value="group">Group</option></select>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Pos</th><th>Reg No</th><th>Name</th><th>Group</th><th>Grade</th><th>X</th></tr></thead>
                <tbody id="entryBody"></tbody>
            </table>
        </div>
        <button class="btn" style="background:var(--success);" onclick="addRow()">+ Add Row</button>
        <button id="saveBtn" class="btn" style="background:var(--primary); width:100%; margin-top:20px;" onclick="saveEvent()">SAVE & PUBLISH TO CLOUD</button>
    </div>

    <div id="events" class="page active">
        <h3>Live Event Results</h3>
        <div id="fullGallery"></div>
    </div>

    <div id="groupTotal" class="page">
        <h3>Group Points Table</h3>
        <div class="table-wrapper"><table id="gtTable"></table></div>
    </div>

    <div id="studentReport" class="page">
        <h3>Individual Search</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
            <input id="stuSearch" placeholder="Enter Registration Number..." style="flex:1;">
            <button class="btn" style="background:var(--primary);" onclick="searchStu()">SEARCH</button>
        </div>
        <div id="stuCard" style="display:none;" class="result-card">
            <h2 id="sNameDisplay" style="text-align:center;"></h2>
            <div id="sPointDisplay" class="points-badge"></div>
            <div class="table-wrapper"><table id="sResTable"></table></div>
        </div>
    </div>
</div>

<script>
    // Ensure this URL is the latest one from "Deploy > New Deployment" as "Anyone"
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwUIKukVOt7TD2WwtYTZIQaCyoDJ29uegZrRqeQXBlLJKIr3MwoaLPe-3d5AnwDp6bv/exec"; 
    const ADMIN_PASSWORD = "fest2026";
    
    let isAdmin = false;
    let events = [];

    function handleAuth() {
        if(!isAdmin) {
            let p = prompt("Enter Admin Password:");
            if(p === ADMIN_PASSWORD) { isAdmin = true; updateAuthUI(); }
            else { alert("Wrong Password"); }
        } else { isAdmin = false; updateAuthUI(); }
    }

    function updateAuthUI() {
        document.getElementById("authBtn").innerText = isAdmin ? "LOGOUT" : "ADMIN LOGIN";
        document.getElementById("nav-entry").style.display = isAdmin ? "inline-block" : "none";
        render();
    }

    function calc(type, pos, grade) {
        let p = parseInt(pos), pts = 0;
        if (type === "individual") {
            pts += (p===1?5 : p===2?3 : p===3?1 : 0);
            pts += (grade==="A+"?5 : grade==="A"?3 : grade==="B"?1 : 0);
        } else {
            pts += (p===1?10 : p===2?6 : p===3?2 : 0);
            pts += (grade==="A+"?10 : grade==="A"?6 : grade==="B"?2 : 0);
        }
        return pts;
    }

    async function syncFromCloud() {
        const status = document.getElementById("syncStatus");
        status.innerHTML = "⌛ Syncing with Cloud...";
        try {
            // Adding a timestamp ensures the browser doesn't cache the old "Failed" response
            const response = await fetch(`${SCRIPT_URL}?t=${Date.now()}`);
            const data = await response.json();
            
            if (data.error) throw new Error(data.error);

            const grouped = {};
            data.forEach(row => {
                if(row.eventName) {
                    if(!grouped[row.eventName]) grouped[row.eventName] = { name: row.eventName, type: row.type, items: [] };
                    grouped[row.eventName].items.push(row);
                }
            });
            events = Object.values(grouped);
            render();
            status.innerHTML = '<span class="live-dot"></span> LIVE FROM CLOUD';
        } catch (e) {
            console.error("Sync Error:", e);
            status.innerHTML = "⚠️ Offline / Connection Failed";
        }
    }

    async function saveEvent() {
        const name = document.getElementById("eventName").value.trim();
        const type = document.getElementById("eventType").value;
        const saveBtn = document.getElementById("saveBtn");
        
        if(!name) return alert("Enter Event Name");
        
        const items = [];
        document.querySelectorAll("#entryBody tr").forEach(tr => {
            const reg = tr.querySelector(".r").value.trim();
            if(reg) {
                const pos = tr.querySelector(".p").value;
                const grade = tr.querySelector(".gr").value;
                items.push({ 
                    eventName: name, type, pos, reg, 
                    name: tr.querySelector(".n").value.trim(), 
                    group: tr.querySelector(".g").value, 
                    grade, 
                    pts: calc(type, pos, grade) 
                });
            }
        });

        if(items.length === 0) return alert("Add at least one person.");

        saveBtn.innerText = "⌛ UPLOADING...";
        saveBtn.disabled = true;

        try {
            await fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', // Crucial for Google Apps Script POST
                body: JSON.stringify({ name, type, items }) 
            });
            
            alert("Results sent to Cloud! Please wait 2 seconds and refresh.");
            resetForm();
            setTimeout(syncFromCloud, 2000);
            showPage('events');
        } catch (e) {
            alert("Error: Connection Failed.");
        } finally {
            saveBtn.innerText = "SAVE & PUBLISH TO CLOUD";
            saveBtn.disabled = false;
        }
    }

    function render() {
        const gal = document.getElementById("fullGallery"); gal.innerHTML = "";
        let groups = {"ARTEZUELA":0, "UGRAN":0, "COSMIC":0, "SPARKERS":0};

        if (events.length === 0) {
            gal.innerHTML = "<p style='text-align:center; color:#888;'>No results published yet.</p>";
        }

        events.forEach((e) => {
            let tableHTML = `<div class="result-card">
                <h4 style="color:var(--primary); margin-top:0;">${e.name.toUpperCase()} (${e.type})</h4>
                <div class="table-wrapper"><table>
                <thead><tr><th>Pos</th><th>Name</th><th>Group</th><th>Grade</th><th>Pts</th></tr></thead><tbody>`;
            
            e.items.forEach(it => {
                if(it.group && groups[it.group] !== undefined) groups[it.group] += (parseInt(it.pts) || 0);
                tableHTML += `<tr><td>${it.pos == 0 ? '-' : it.pos}</td><td>${it.name}</td><td>${it.group}</td><td>${it.grade}</td><td>${it.pts}</td></tr>`;
            });
            gal.innerHTML += tableHTML + `</tbody></table></div></div>`;
        });

        const gt = document.getElementById("gtTable"); gt.innerHTML = "<tr><th>Rank</th><th>Group</th><th>Points</th></tr>";
        Object.entries(groups).sort((a,b)=>b[1]-a[1]).forEach((g, idx) => {
            gt.innerHTML += `<tr><td>${idx+1}</td><td>${g[0]}</td><td><b>${g[1]}</b></td></tr>`;
        });
    }

    function addRow() {
        const b = document.getElementById("entryBody");
        const r = b.insertRow();
        r.innerHTML = `<td><select class="p"><option value="0">None</option><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option></select></td>
            <td><input class="r" placeholder="Reg No"></td><td><input class="n" placeholder="Name"></td>
            <td><select class="g"><option>ARTEZUELA</option><option>UGRAN</option><option>COSMIC</option><option>SPARKERS</option></select></td>
            <td><select class="gr"><option>A+</option><option>A</option><option>B</option><option>C</option></select></td>
            <td><button class="delete-btn" onclick="this.parentElement.parentElement.remove()">×</button></td>`;
    }

    function searchStu() {
        let q = document.getElementById("stuSearch").value.trim();
        let found = false, total = 0, name = "", html = "<thead><tr><th>Event</th><th>Pos</th><th>Grade</th><th>Pts</th></tr></thead><tbody>";
        events.forEach(e => e.items.forEach(it => {
            if(it.reg == q) {
                found = true; name = it.name; total += (parseInt(it.pts) || 0);
                html += `<tr><td>${e.name}</td><td>${it.pos == 0 ? '-' : it.pos}</td><td>${it.grade}</td><td>${it.pts}</td></tr>`;
            }
        }));
        if(found) {
            document.getElementById("stuCard").style.display = "block";
            document.getElementById("sNameDisplay").innerText = name.toUpperCase();
            document.getElementById("sPointDisplay").innerText = "TOTAL POINTS: " + total;
            document.getElementById("sResTable").innerHTML = html + "</tbody>";
        } else { alert("Student ID not found."); }
    }

    function resetForm() { document.getElementById("eventName").value = ""; document.getElementById("entryBody").innerHTML = ""; for(let i=0; i<3; i++) addRow(); }
    function showPage(p) { document.querySelectorAll(".page").forEach(x => x.classList.remove("active")); document.getElementById(p).classList.add("active"); }

    window.onload = () => { resetForm(); syncFromCloud(); };
</script>
</body>
</html>
