<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <title>കലസ്തീൻ 2026 – Arts Fest (Cloud Sync)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        :root { --primary: #4a148c; --secondary: #7b1fa2; --accent: #ffc107; --bg: #f5f6fa; --text: #2f3640; --success: #27ae60; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #e0e0e0; margin: 0; padding: 10px; color: var(--text); }
        .container { max-width: 1100px; margin: auto; background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        
        nav { background: var(--primary); padding: 10px; border-radius: 12px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 25px; position: sticky; top: 10px; z-index: 100; }
        nav a { color: white; text-decoration: none; font-weight: bold; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        nav a:hover { background: var(--accent); color: var(--primary); }

        .page { display: none; animation: fadeIn 0.3s; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .table-wrapper { width: 100%; overflow-x: auto; margin-top: 15px; border-radius: 8px; }
        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th { background: var(--primary); color: white; padding: 12px; font-size: 12px; text-transform: uppercase; }
        td { padding: 10px; text-align: center; border: 1px solid #eee; background: #fff; }

        input, select { padding: 10px; width: 100%; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; margin-bottom: 5px; font-size: 14px; }
        .btn { border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; color: white; margin: 5px; transition: 0.3s; display: inline-block; }
        
        .result-card { border: 2px solid var(--primary); border-radius: 12px; padding: 15px; margin-top: 25px; background: #fdfdfd; }
        .points-badge { background: var(--accent); color: #000; padding: 15px; font-size: 28px; font-weight: bold; text-align: center; border-radius: 8px; margin: 15px 0; }
        
        .status-indicator { font-size: 12px; text-align: center; margin-bottom: 10px; color: #666; }
        .live-dot { height: 10px; width: 10px; background-color: #ff4757; border-radius: 50%; display: inline-block; margin-right: 5px; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        @media print {
            nav, .no-print, .btn, .admin-only { display: none !important; }
            .container { box-shadow: none; width: 100%; padding: 0; }
            .page { display: none !important; }
            .page.active { display: block !important; }
            .print-header { display: block !important; text-align: center; border-bottom: 3px solid #000; }
        }
        .print-header { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="print-header">
        <h1>PRISTINE VALLEY COLLEGE</h1>
        <h3 id="docTitle">OFFICIAL RESULT SHEET</h3>
    </div>

    <div class="no-print">
        <h1 style="text-align:center; color: var(--primary); margin-bottom:5px;">കലസ്തീൻ <small style="font-size: 14px;">2026</small></h1>
        <div class="status-indicator"><span class="live-dot"></span> Local Sync Active</div>
    </div>
    
    <nav class="no-print">
        <a id="nav-entry" style="display:none;" onclick="showPage('home')">ENTRY FORM</a>
        <a onclick="showPage('events')">EVENT LIST</a>
        <a onclick="showPage('groupTotal')">LEADERBOARD</a>
        <a onclick="showPage('studentReport')">SEARCH</a>
        <a onclick="showPage('allResults')">FULL RESULTS</a>
        <a id="authBtn" onclick="handleAuth()" style="background:var(--accent); color:black;">ADMIN LOGIN</a>
    </nav>

    <div id="home" class="page">
        <h3 id="formTitle">New Result Entry</h3>
        <input type="hidden" id="editIndex" value="-1">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-bottom:15px;">
            <input id="eventName" placeholder="Event Name (e.g. Oppana)">
            <select id="eventType"><option value="individual">Individual Event</option><option value="group">Group Event</option></select>
        </div>
        <div class="table-wrapper">
            <table>
                <thead><tr><th>Pos</th><th>Reg No</th><th>Name</th><th>Group</th><th>Grade</th><th>X</th></tr></thead>
                <tbody id="entryBody"></tbody>
            </table>
        </div>
        <button class="btn" style="background:var(--success);" onclick="addRow()">+ Add Person</button>
        <button id="saveBtn" class="btn" style="background:var(--primary); width:100%; margin-top:20px; font-size:16px;" onclick="saveEvent()">SAVE & SYNC TO CLOUD</button>
    </div>

    <div id="events" class="page active">
        <h3>Registered Events</h3>
        <div class="table-wrapper"><table><thead><tr><th>Event Name</th><th>Category</th><th>Actions</th></tr></thead><tbody id="listBody"></tbody></table></div>
        <button class="btn admin-only" style="display:none; background:#c0392b; margin-top:40px;" onclick="clearAllData()">⚠️ DELETE ALL DATA</button>
    </div>

    <div id="groupTotal" class="page">
        <h3>Group Points Table</h3>
        <div class="table-wrapper"><table id="gtTable" style="font-size: 18px;"></table></div>
        <button class="btn no-print" style="background:var(--primary); margin-top:15px;" onclick="preparePrint('Group Standings')">Print Rankings</button>
    </div>

    <div id="studentReport" class="page">
        <h3>Individual Search</h3>
        <div class="no-print" style="text-align:center; margin-bottom:20px;">
            <input id="stuSearch" placeholder="Enter Registration Number..." style="max-width:300px; display:inline-block;">
            <button class="btn" style="background:var(--primary);" onclick="searchStu()">SEARCH</button>
        </div>
        <div id="stuCard" style="display:none;" class="result-card">
            <h2 id="sNameDisplay" style="text-align:center;"></h2>
            <div id="sPointDisplay" class="points-badge"></div>
            <table id="sResTable"></table>
        </div>
    </div>

    <div id="allResults" class="page">
        <div class="no-print" style="display:flex; justify-content: space-between; align-items: center; flex-wrap:wrap;">
            <h3>Consolidated Results</h3>
            <button class="btn" style="background:#2c3e50;" onclick="preparePrint('Full Results')">Print All</button>
        </div>
        <div id="fullGallery"></div>
    </div>

    <div id="viewPage" class="page">
        <h2 id="viewTitle" style="text-align:center;"></h2>
        <div class="table-wrapper"><table id="viewTable"></table></div>
        <div class="no-print" style="text-align:center; margin-top:20px;">
            <button class="btn" style="background:#2c3e50;" onclick="window.print()">Print This Result</button>
            <button class="btn" style="background:#888;" onclick="showPage('events')">Back</button>
        </div>
    </div>
</div>

<script>
    // --- CONFIGURATION ---
    const SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL_HERE"; // PASTE YOUR URL HERE
    const ADMIN_PASSWORD = "fest2026";
    
    let isAdmin = false;
    let events = JSON.parse(localStorage.getItem("arts_fest_data")) || [];

    function handleAuth() {
        if(!isAdmin) {
            let p = prompt("Enter Admin Password:");
            if(p === ADMIN_PASSWORD) { isAdmin = true; updateAuthUI(); }
            else { alert("Access Denied"); }
        } else { isAdmin = false; updateAuthUI(); showPage('events'); }
    }

    function updateAuthUI() {
        document.getElementById("authBtn").innerText = isAdmin ? "LOGOUT" : "ADMIN LOGIN";
        document.getElementById("authBtn").style.background = isAdmin ? "#e74c3c" : "var(--accent)";
        document.getElementById("nav-entry").style.display = isAdmin ? "inline-block" : "none";
        document.querySelectorAll(".admin-only").forEach(el => el.style.display = isAdmin ? "block" : "none");
        render();
    }

    function calc(type, pos, grade) {
        let p = parseInt(pos), pts = 0;
        if (type === "individual") {
            pts += (p===1?5 : p===2?3 : p===3?1 : 0);
            pts += (grade==="A+"?5 : grade==="A"?3 : grade==="B"?1 : 0);
        } else {
            pts += (p===1?10 : p===2?6 : p===3?2 : 0);
            pts += (grade==="A+"?10 : grade==="A"?6 : grade==="B"?2 : 0);
        }
        return pts;
    }

    function addRow(data = null) {
        const b = document.getElementById("entryBody");
        const r = b.insertRow();
        r.innerHTML = `
            <td><select class="p"><option value="0">None</option><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option></select></td>
            <td><input class="r" placeholder="Reg No"></td><td><input class="n" placeholder="Name"></td>
            <td><select class="g"><option value="">Select Group</option><option>ARTEZUELA</option><option>UGRAN</option><option>COSMIC</option><option>SPARKERS</option></select></td>
            <td><select class="gr"><option value="">Nil</option><option>A+</option><option>A</option><option>B</option><option>C</option></select></td>
            <td><button class="btn" style="background:#ff4757; padding:5px 10px;" onclick="this.parentElement.parentElement.remove()">×</button></td>`;
        if(data) {
            const i = r.querySelectorAll("input, select");
            i[0].value = data.pos; i[1].value = data.reg; i[2].value = data.name; i[3].value = data.group; i[4].value = data.grade;
        }
    }

    async function saveEvent() {
        const name = document.getElementById("eventName").value;
        const type = document.getElementById("eventType").value;
        const saveBtn = document.getElementById("saveBtn");

        if(!name) return alert("Please enter the Event Name");
        
        saveBtn.innerText = "⌛ SYNCING...";
        saveBtn.disabled = true;

        let items = [];
        document.querySelectorAll("#entryBody tr").forEach(tr => {
            const reg = tr.querySelector(".r").value;
            if(reg) {
                items.push({ 
                    pos: tr.querySelector(".p").value, reg, 
                    name: tr.querySelector(".n").value, group: tr.querySelector(".g").value, 
                    grade: tr.querySelector(".gr").value, 
                    pts: calc(type, tr.querySelector(".p").value, tr.querySelector(".gr").value) 
                });
            }
        });

        // 1. Sync to Google Sheets
        if(SCRIPT_URL !== "YOUR_GOOGLE_SCRIPT_URL_HERE") {
            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    cache: 'no-cache',
                    body: JSON.stringify({ name, type, items })
                });
            } catch (e) { console.log("Cloud sync failed, saving locally."); }
        }

        // 2. Save Locally
        const editIdx = parseInt(document.getElementById("editIndex").value);
        if(editIdx === -1) events.push({ name, type, items }); else events[editIdx] = { name, type, items };
        
        localStorage.setItem("arts_fest_data", JSON.stringify(events));
        alert("Success: Result Secured!");
        
        saveBtn.innerText = "SAVE & SYNC TO CLOUD";
        saveBtn.disabled = false;
        resetForm(); render(); showPage('events');
    }

    function render() {
        const lb = document.getElementById("listBody"); lb.innerHTML = "";
        let groups = {"ARTEZUELA":0, "UGRAN":0, "COSMIC":0, "SPARKERS":0}, students = {}, gal = document.getElementById("fullGallery");
        gal.innerHTML = "";

        events.forEach((e, i) => {
            // List Page
            let btns = `<button class="btn" style="background:#3498db;" onclick="viewEvent(${i})">View</button>`;
            if(isAdmin) {
                btns += `<button class="btn" style="background:#f39c12;" onclick="restoreToEntry(${i})">Edit</button>`;
                btns += `<button class="btn" style="background:#e74c3c;" onclick="delEvent(${i})">Del</button>`;
            }
            lb.innerHTML += `<tr><td>${e.name}</td><td>${e.type}</td><td>${btns}</td></tr>`;

            // Results Gallery
            let tableHTML = `<div class="result-card"><h4>${e.name.toUpperCase()} (${e.type})</h4><table><thead><tr><th>Pos</th><th>Reg</th><th>Name</th><th>Group</th><th>Grade</th><th>Pts</th></tr></thead><tbody>`;
            e.items.forEach(it => {
                if(it.group) groups[it.group] += it.pts;
                students[it.reg] = students[it.reg] || { name: it.name, group: it.group, pts: 0 };
                students[it.reg].pts += it.pts;
                tableHTML += `<tr><td>${it.pos==0?'-':it.pos}</td><td>${it.reg}</td><td>${it.name}</td><td>${it.group}</td><td>${it.grade}</td><td>${it.pts}</td></tr>`;
            });
            gal.innerHTML += tableHTML + `</tbody></table></div>`;
        });

        // Leaderboard
        const gt = document.getElementById("gtTable"); gt.innerHTML = "<tr><th>Rank</th><th>Group Name</th><th>Total Points</th></tr>";
        Object.entries(groups).sort((a,b)=>b[1]-a[1]).forEach((g, idx) => {
            gt.innerHTML += `<tr><td>${idx+1}</td><td>${g[0]}</td><td><b style="color:var(--primary)">${g[1]}</b></td></tr>`;
        });
    }

    function searchStu() {
        let q = document.getElementById("stuSearch").value.trim().toUpperCase();
        if(!q) return;
        let found = false, total = 0, items = [], sName="";
        events.forEach(e => e.items.forEach(it => {
            if(it.reg.toUpperCase() === q) {
                if(!found) { sName=it.name; found=true; }
                items.push({ ev: e.name, p: it.pos, g: it.grade, pts: it.pts });
                total += it.pts;
            }
        }));
        if(found) {
            document.getElementById("stuCard").style.display = "block";
            document.getElementById("sNameDisplay").innerText = sName.toUpperCase();
            document.getElementById("sPointDisplay").innerText = `TOTAL POINTS: ${total}`;
            let st = document.getElementById("sResTable"); st.innerHTML = "<tr><th>Event</th><th>Pos</th><th>Grade</th><th>Pts</th></tr>";
            items.forEach(i => st.innerHTML += `<tr><td>${i.ev}</td><td>${i.p==0?'-':i.p}</td><td>${i.g}</td><td>${i.pts}</td></tr>`);
        } else { alert("Student not found in results."); }
    }

    function viewEvent(i) {
        const e = events[i]; document.getElementById("viewTitle").innerText = e.name.toUpperCase();
        let vt = document.getElementById("viewTable"); vt.innerHTML = "<thead><tr><th>Pos</th><th>Reg No</th><th>Name</th><th>Group</th><th>Grade</th><th>Pts</th></tr></thead><tbody>";
        e.items.forEach(it => vt.innerHTML += `<tr><td>${it.pos==0?'-':it.pos}</td><td>${it.reg}</td><td>${it.name}</td><td>${it.group}</td><td>${it.grade}</td><td>${it.pts}</td></tr>`);
        showPage('viewPage');
    }

    function restoreToEntry(i) {
        const e = events[i];
        document.getElementById("eventName").value = e.name;
        document.getElementById("eventType").value = e.type;
        document.getElementById("editIndex").value = i;
        document.getElementById("entryBody").innerHTML = "";
        document.getElementById("formTitle").innerText = "Editing: " + e.name;
        e.items.forEach(it => addRow(it));
        showPage('home');
    }

    function delEvent(i) { if(confirm("Permanently delete this result?")) { events.splice(i,1); localStorage.setItem("arts_fest_data", JSON.stringify(events)); render(); } }
    function clearAllData() { if(confirm("This will erase EVERYTHING. Are you sure?")) { localStorage.clear(); location.reload(); } }
    function showPage(p) { document.querySelectorAll(".page").forEach(x => x.classList.remove("active")); document.getElementById(p).classList.add("active"); }
    function resetForm() { document.getElementById("editIndex").value = "-1"; document.getElementById("eventName").value = ""; document.getElementById("entryBody").innerHTML = ""; for(let i=0; i<3; i++) addRow(); document.getElementById("formTitle").innerText = "New Result Entry"; }
    function preparePrint(t) { document.getElementById("docTitle").innerText = t; window.print(); }

    window.onload = () => { 
        resetForm(); 
        render();
        // Allow "Enter" to search
        document.getElementById("stuSearch").addEventListener("keypress", (e) => { if(e.key === "Enter") searchStu(); });
    };
</script>
</body>
</html>
